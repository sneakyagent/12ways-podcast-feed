name: Refresh podcast feed

on:
  schedule:
    - cron: "17 * * * *"   # hourly, offset to avoid the top-of-hour rush
  workflow_dispatch:        # lets you trigger it by hand after an upload
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild feed from Odysee
        run: python3 build_feed.py feed.xml

      - name: Commit if the feed changed
        run: |
          if git diff --quiet -- feed.xml; then
            echo "no change"
            exit 0
          fi
          git config user.name "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          git add feed.xml
          git commit -m "Refresh feed from Odysee"
          git push
