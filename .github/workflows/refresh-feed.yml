name: Refresh podcast feed

on:
  schedule:
    - cron: "17 * * * *"   # hourly, offset to avoid the top-of-hour rush
  workflow_dispatch:        # lets you trigger it by hand after an upload
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild feed from Odysee
        run: |
          python3 build_feed.py feed.xml
          # Keepalive: GitHub disables scheduled workflows after 60 days of
          # repo inactivity. Always touching this file guarantees a commit,
          # so a long gap between episodes can't switch the job off.
          date -u +"%Y-%m-%d" > last-run.txt

      - name: Commit refreshed feed
        run: |
          git config user.name "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          git add feed.xml last-run.txt
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          git commit -m "Refresh feed from Odysee"
          git push
